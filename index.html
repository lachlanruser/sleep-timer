<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241812">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sleep Timer">
  <title>Sleep Timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main class="stage">
    <div class="candle-glow" aria-hidden="true"></div>
    <div class="sky" id="sky" aria-hidden="true"></div>
    <section id="home" class="view view-home" aria-label="Tonight's routine">
      <header class="top">
        <h1 class="title">Tonight</h1>
        <p class="date" id="dateLabel"></p>
      </header>
      <div class="circle-wrap">
        <svg id="pie" class="pie" viewBox="-104 -104 208 208" role="group" aria-label="Bedtime tasks"></svg>
      </div>
      <div class="below">
        <p class="streak" id="streak" aria-live="polite"></p>
        <p class="hint" id="hint">Tap a task to begin</p>
        <div class="done-msg" id="doneMsg" hidden>
          <p class="done-title" id="doneTitle"></p>
          <p class="done-sub" id="doneSub"></p>
        </div>
      </div>
    </section>

    <section id="timer" class="view view-timer" aria-label="Timer" inert>
      <p class="task-name"><span id="timerIcon" class="task-icon"></span><span id="timerTask"></span></p>
      <div class="ring-wrap" id="ringWrap">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fbe2ae"></stop>
              <stop offset="1" stop-color="#e0974a"></stop>
            </linearGradient>
            <radialGradient id="flameGrad" cx="50%" cy="72%" r="65%">
              <stop offset="0" stop-color="#fff7df"></stop>
              <stop offset="0.45" stop-color="#ffd27c"></stop>
              <stop offset="1" stop-color="#ee8a3c"></stop>
            </radialGradient>
          </defs>
          <circle class="ring-track" cx="110" cy="110" r="100"></circle>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100" transform="rotate(-90 110 110)"></circle>
          <g id="flamePos">
            <g class="flame">
              <circle class="flame-glow" cx="110" cy="9" r="9"></circle>
              <path class="flame-shape" d="M110 0.5C114.2 5.5 116.2 9.6 113.6 13.6C112.2 15.6 107.8 15.6 106.4 13.6C103.8 9.6 105.8 5.5 110 0.5Z" fill="url(#flameGrad)"></path>
            </g>
          </g>
        </svg>
        <div class="ring-center">
          <div class="time" id="timeLeft" role="timer" aria-live="off">0:00</div>
          <div class="ends" id="endsAt"></div>
        </div>
      </div>
      <div class="controls">
        <button id="cancelBtn" class="btn btn-ghost" type="button">Cancel</button>
        <button id="pauseBtn" class="btn" type="button">Pause</button>
      </div>
      <p class="wake-note" id="wakeNote"></p>
      <p class="test-info" id="testInfo"></p>
    </section>

    <div class="fx" id="fx" aria-hidden="true"></div>

    <div id="confirm" class="sheet" hidden>
      <div class="sheet-card" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmSub">
        <p class="sheet-title" id="confirmTitle">Stop this task?</p>
        <p class="sheet-sub" id="confirmSub">It won't count towards tonight.</p>
        <div class="sheet-row">
          <button id="stopBtn" class="btn btn-ghost" type="button">Stop</button>
          <button id="keepBtn" class="btn" type="button">Keep going</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
